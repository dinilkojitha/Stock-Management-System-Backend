server:
  port: 2020


spring:
  application:
    name: Stock-Management-System-Backend

  # MySQL Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/se_V2}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
